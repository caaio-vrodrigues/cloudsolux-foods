server:
  port: 8080

spring:
  application:
    name: cloudsolux-foods
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
  web:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  packagesToScan: com.cloudsolux.foods

jwt:
  secret: ${SPRING_JWT_PASSWORD}